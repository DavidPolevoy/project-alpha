# Reads governance.yaml from the BASE branch, labels the PR, and turns on GitHub auto-merge when every
# touched path is auto-policy. Review-policy paths are held by CODEOWNERS in the ruleset.
# Auto-merge is enabled with the follow App's token: a merge GitHub performs for GITHUB_TOKEN starts
# no workflows, so auto-resolve (and follow-dispatch downstream) would never see it.
# The branch-name step is the fallback for accounts where the branch_name_pattern rule is unavailable.
name: policy
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: { contents: read, pull-requests: write }
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: branch name
        env: { HEAD: "${{ github.head_ref }}" }
        run: |
          [[ "$HEAD" =~ ^(agent|web)/[a-z0-9-]+/.+$|^follow/.+$|^copilot/.+$|^(release|hotfix)/[^/]+$|^feature/[^/]+/[^/]+$|^(dev|main|master)$ ]] \
            || { echo "::error::branch '$HEAD' is not an allowed name (writers: agent/<user>/…, web/<user>/…; umbrellas: feature/<f>/main)"; exit 1; }
      - uses: actions/create-github-app-token@v1
        id: app
        with: { app-id: "${{ vars.FOLLOW_APP_ID }}", private-key: "${{ secrets.FOLLOW_APP_KEY }}" }
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - id: decide
        run: node .github/scripts/policy.mjs "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "policy:${{ steps.decide.outputs.merge }}"
        env: { GH_TOKEN: "${{ github.token }}" }
      - if: steps.decide.outputs.merge == 'auto' && !startsWith(github.head_ref, 'follow/')
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --merge
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
